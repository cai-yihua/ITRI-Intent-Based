<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Antenna tower -->
  <polygon points="50,15 42,55 58,55" fill="white" opacity="0.9"/>
  <rect x="47" y="10" width="6" height="10" rx="1" fill="white" opacity="0.95"/>
  <!-- Signal waves -->
  <path d="M 30 30 Q 25 35, 30 40" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 24 25 Q 17 35, 24 45" stroke="white" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 70 30 Q 75 35, 70 40" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 76 25 Q 83 35, 76 45" stroke="white" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- Base platform -->
  <rect x="25" y="55" width="50" height="6" rx="2" fill="white" opacity="0.8"/>
  <!-- Dispatch nodes -->
  <circle cx="25" cy="75" r="8" fill="white" opacity="0.7"/>
  <circle cx="50" cy="75" r="8" fill="white" opacity="0.7"/>
  <circle cx="75" cy="75" r="8" fill="white" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="38" y1="61" x2="25" y2="67" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="61" x2="50" y2="67" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="62" y1="61" x2="75" y2="67" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Role icons -->
  <text x="25" y="78" text-anchor="middle" font-size="9" fill="#0EA5E9" font-weight="bold">CS</text>
  <text x="50" y="78" text-anchor="middle" font-size="9" fill="#0EA5E9" font-weight="bold">NM</text>
  <text x="75" y="78" text-anchor="middle" font-size="9" fill="#0EA5E9" font-weight="bold">DA</text>
  <!-- Label -->
  <text x="50" y="93" text-anchor="middle" font-size="7" fill="white" opacity="0.7">INTENT</text>
</svg>
