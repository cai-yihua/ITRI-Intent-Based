identity:
  name: simulate_im
  author: ITRI
  label:
    zh_Hans: 模擬 IM 優化
    en_US: Simulate IM Optimization
description:
  human:
    zh_Hans: 模擬干擾管理(IM)優化效果
    en_US: Simulate Interference Management (IM) Optimization
  llm: >-
    模擬干擾管理(IM)優化效果，不會實際啟用。執行前必須先調用 get_active_rapp_status 確認無優化正在執行。參數同 enable_im。
    參數互斥，依優先級擇一使用：
    1. location（地點代碼：電梯前=131, 501走廊=132, 503會議室=135）
    2. all_edge=true（所有受干擾 UE）
    3. all_center=true（所有未受干擾 UE）
    4. worst_part（效能最差比例，0.1=最差10%）
    5. 全部不填=優化整個場域。
    可選 optimization_inc_percent（提升比例，預設0.1即10%）。
parameters:
  - name: location
    type: string
    required: false
    label:
      zh_Hans: 地點代碼
      en_US: Location Code
    human_description:
      zh_Hans: "地點代碼：電梯前=131, 501走廊=132, 503會議室=135"
      en_US: "Location code: elevator=131, corridor 501=132, room 503=135"
    form: llm
  - name: all_edge
    type: boolean
    required: false
    label:
      zh_Hans: 所有受干擾 UE
      en_US: All Edge UEs
    human_description:
      zh_Hans: 設為 true 模擬優化所有受干擾 UE
      en_US: Set to true to simulate optimizing all edge (interfered) UEs
    form: llm
  - name: all_center
    type: boolean
    required: false
    label:
      zh_Hans: 所有未受干擾 UE
      en_US: All Center UEs
    human_description:
      zh_Hans: 設為 true 模擬優化所有未受干擾 UE
      en_US: Set to true to simulate optimizing all center (non-interfered) UEs
    form: llm
  - name: worst_part
    type: number
    required: false
    label:
      zh_Hans: 效能最差比例
      en_US: Worst Part Ratio
    human_description:
      zh_Hans: 效能最差比例，例如 0.1 表示最差 10%
      en_US: Worst performance ratio, e.g. 0.1 means worst 10%
    form: llm
  - name: optimization_inc_percent
    type: number
    required: false
    default: 0.1
    label:
      zh_Hans: 優化提升比例
      en_US: Optimization Increase Percent
    human_description:
      zh_Hans: 優化提升比例，預設 0.1 即 10%
      en_US: Optimization increase percent, default 0.1 (10%)
    form: llm
