identity:
  name: get_ue_status
  author: ITRI
  label:
    zh_Hans: 查詢 UE 狀態
    en_US: Get UE Status
description:
  human:
    zh_Hans: 查詢 UE 狀態
    en_US: Get UE Status
  llm: >-
    查詢 UE 狀態。參數互斥，依優先級擇一使用：
    1. ueid（指定 UE ID，純數字字串）
    2. location（地點代碼：電梯前=131, 501走廊=132, 503會議室=135）
    3. all_edge=true（所有受干擾 UE）
    4. all_center=true（所有未受干擾 UE）
    5. worst_part（效能最差比例，0.1=最差10%）
    6. 全部不填=查詢所有 UE
parameters:
  - name: ueid
    type: string
    required: false
    label:
      zh_Hans: UE ID
      en_US: UE ID
    human_description:
      zh_Hans: 指定 UE ID（純數字字串）
      en_US: Specific UE ID (numeric string)
    form: llm
  - name: location
    type: string
    required: false
    label:
      zh_Hans: 地點代碼
      en_US: Location Code
    human_description:
      zh_Hans: "地點代碼：電梯前=131, 501走廊=132, 503會議室=135"
      en_US: "Location code: elevator=131, corridor 501=132, room 503=135"
    form: llm
  - name: all_edge
    type: boolean
    required: false
    label:
      zh_Hans: 所有受干擾 UE
      en_US: All Edge UEs
    human_description:
      zh_Hans: 設為 true 查詢所有受干擾 UE
      en_US: Set to true to query all edge (interfered) UEs
    form: llm
  - name: all_center
    type: boolean
    required: false
    label:
      zh_Hans: 所有未受干擾 UE
      en_US: All Center UEs
    human_description:
      zh_Hans: 設為 true 查詢所有未受干擾 UE
      en_US: Set to true to query all center (non-interfered) UEs
    form: llm
  - name: worst_part
    type: number
    required: false
    label:
      zh_Hans: 效能最差比例
      en_US: Worst Part Ratio
    human_description:
      zh_Hans: 效能最差比例，例如 0.1 表示最差 10%
      en_US: Worst performance ratio, e.g. 0.1 means worst 10%
    form: llm
